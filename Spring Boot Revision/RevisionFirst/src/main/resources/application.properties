spring.application.name=RevisionFirst

#Database Name
spring.datasource.name = springbootrev

#Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/springbootrev?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=harsh@aA1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

#Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Port
server.port=8081

#-------------- File Uploading and Image Uploading -----------------
#Multipart Configuration

#Enabling Multipart Upload
spring.servlet.multipart.enabled=true

#File Max Upload Size
spring.servlet.multipart.max-file-size=300MB

#Threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=1KB

